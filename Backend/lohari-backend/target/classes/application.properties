# ==============================================
# SERVER CONFIGURATION
# ==============================================
server.port=8081
spring.application.name=lohari-backend

# ==============================================
# DATABASE CONFIGURATION (PostgreSQL)
# ==============================================
# First create database in PostgreSQL:
# CREATE DATABASE lohari_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/lohari_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000

# ==============================================
# JPA CONFIGURATION
# ==============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================================
# JWT CONFIGURATION
# ==============================================
jwt.secret=bXktc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRva2Vucy0yMDI0
jwt.expiration=86400000            
jwt.refresh-expiration=604800000     

# ==============================================
# OAUTH2 CONFIGURATION (Google)
# ==============================================
# ⚠️ Replace with your actual Google Client ID and Secret
# Get from: https://console.cloud.google.com/
spring.security.oauth2.client.registration.google.client-id=130483133285-tblp8nvjb94orjfouuhg9ipk1mot05mb.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
# ==============================================
# EMAIL CONFIGURATION (Gmail SMTP)
# ==============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lohari.orders@gmail.com
spring.mail.password=${MAIL_PASSWORD:lctg tctv stin rodp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================
# FILE UPLOAD CONFIGURATION
# ==============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
app.file.upload-dir=./uploads

# ==============================================
# CORS - FRONTEND CONFIGURATION
# ==============================================
app.frontend-url=http://localhost:5173
cors.allowed-origins=http://localhost:3001,http://localhost:3000,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ==============================================
# ORDER CONFIGURATION
# ==============================================
order.cart.timeout-minutes=30
order.payment.timeout-minutes=15
product.default-image=/images/default-product.png
product.page-size=20

# ==============================================
# LOGGING CONFIGURATION
# ==============================================
logging.level.com.lohari=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/lohari-backend.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==============================================
# ACTUATOR (Monitoring)
# ==============================================
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ==============================================
# SERVER CONFIGURATION
# ==============================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# ==============================================
# PRODUCT SPECIFIC CONFIG
# ==============================================
product.cache.enabled=true